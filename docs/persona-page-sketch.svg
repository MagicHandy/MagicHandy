<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Segoe UI, system-ui, sans-serif">
  <title>MagicHandy Personas page with a centered editor window</title>
  <desc>The Personas workspace has a navigation rail, a page heading aligned with a portrait tile grid, and a centered modal editor over the dimmed page. The editor has fixed header and action rows with a scrolling section area between them.</desc>
  <defs>
    <clipPath id="frame">
      <rect x="6" y="6" width="988" height="688" rx="16"/>
    </clipPath>
    <linearGradient id="portrait-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3c4a58"/>
      <stop offset="1" stop-color="#22282f"/>
    </linearGradient>
    <linearGradient id="portrait-b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4038"/>
      <stop offset="1" stop-color="#241f1c"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101215" stop-opacity="0"/>
      <stop offset="1" stop-color="#101215" stop-opacity="0.96"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="6" y="6" width="988" height="688" fill="#0e0f11"/>

    <!-- Navigation rail -->
    <rect x="6" y="6" width="150" height="688" fill="#17191d"/>
    <line x1="156" y1="6" x2="156" y2="694" stroke="#2d3138"/>
    <rect x="22" y="22" width="30" height="30" rx="7" fill="#345f86"/>
    <text x="37" y="43" fill="#dcecf8" font-size="15" font-weight="700" text-anchor="middle">M</text>
    <text x="62" y="36" fill="#eae9e4" font-size="12" font-weight="600">MagicHandy</text>
    <text x="62" y="49" fill="#98a0a9" font-size="9">local / Cloud REST</text>
    <line x1="14" y1="64" x2="148" y2="64" stroke="#2d3138"/>
    <text x="26" y="92" fill="#98a0a9" font-size="11">Chat</text>
    <rect x="14" y="104" width="134" height="26" rx="7" fill="#26394b"/>
    <text x="26" y="121" fill="#eae9e4" font-size="11" font-weight="600">Personas</text>
    <text x="26" y="148" fill="#98a0a9" font-size="11">Preset modes</text>
    <text x="26" y="174" fill="#98a0a9" font-size="11">Pattern library</text>
    <text x="26" y="200" fill="#98a0a9" font-size="11">Videos</text>
    <text x="26" y="226" fill="#98a0a9" font-size="11">Settings</text>

    <!-- Page heading and explicitly start-aligned tile grid -->
    <text x="184" y="42" fill="#eae9e4" font-size="19" font-weight="600">Personas</text>
    <text x="184" y="62" fill="#98a0a9" font-size="10.5">Portrait, name, register, and behavior - saved together.</text>

    <rect x="184" y="84" width="150" height="200" rx="8" fill="#1a1d21" stroke="#3d434c" stroke-dasharray="5 4"/>
    <circle cx="259" cy="166" r="19" fill="none" stroke="#5b9dd9" stroke-width="1.4"/>
    <line x1="250" y1="166" x2="268" y2="166" stroke="#5b9dd9" stroke-width="1.6"/>
    <line x1="259" y1="157" x2="259" y2="175" stroke="#5b9dd9" stroke-width="1.6"/>
    <text x="259" y="207" fill="#eae9e4" font-size="11" font-weight="600" text-anchor="middle">New persona</text>

    <g>
      <rect x="346" y="84" width="150" height="200" rx="8" fill="url(#portrait-a)" stroke="#5b9dd9" stroke-width="2"/>
      <circle cx="421" cy="150" r="31" fill="#536170" opacity="0.55"/>
      <rect x="346" y="192" width="150" height="92" rx="8" fill="url(#scrim)"/>
      <rect x="356" y="94" width="42" height="16" rx="7" fill="#5b9dd9"/>
      <text x="377" y="105" fill="#0b131c" font-size="8.5" font-weight="700" text-anchor="middle">active</text>
      <text x="357" y="243" fill="#eae9e4" font-size="12" font-weight="600">Rowan</text>
      <text x="357" y="259" fill="#98a0a9" font-size="9">Steady and low-voiced.</text>
    </g>

    <g>
      <rect x="508" y="84" width="150" height="200" rx="8" fill="url(#portrait-b)" stroke="#2d3138"/>
      <circle cx="583" cy="150" r="31" fill="#61584f" opacity="0.55"/>
      <rect x="508" y="192" width="150" height="92" rx="8" fill="url(#scrim)"/>
      <text x="519" y="243" fill="#eae9e4" font-size="12" font-weight="600">Morgan</text>
      <text x="519" y="259" fill="#98a0a9" font-size="9">Playful and attentive.</text>
    </g>

    <text x="184" y="306" fill="#98a0a9" font-size="9.5">2 personas</text>

    <!-- One overlay layer. Emergency Stop remains above it in the real app. -->
    <rect x="6" y="6" width="988" height="688" fill="#000" opacity="0.72"/>

    <!-- Centered editor window -->
    <rect x="232" y="50" width="630" height="600" rx="8" fill="#17191d" stroke="#3d434c"/>
    <line x1="232" y1="106" x2="862" y2="106" stroke="#2d3138"/>
    <text x="252" y="84" fill="#eae9e4" font-size="16" font-weight="600">Edit Rowan</text>
    <rect x="810" y="62" width="34" height="34" rx="6" fill="none" stroke="#3d434c"/>
    <text x="827" y="84" fill="#98a0a9" font-size="16" text-anchor="middle">x</text>

    <!-- Scrolling body: unframed sections separated by rules -->
    <text x="252" y="134" fill="#98a0a9" font-size="10" font-weight="600">IDENTITY</text>
    <rect x="252" y="148" width="72" height="96" rx="6" fill="url(#portrait-a)" stroke="#2d3138"/>
    <text x="340" y="158" fill="#98a0a9" font-size="8.5">Name</text>
    <rect x="340" y="164" width="232" height="30" rx="5" fill="#101215" stroke="#2d3138"/>
    <text x="350" y="183" fill="#eae9e4" font-size="10">Rowan</text>
    <text x="590" y="158" fill="#98a0a9" font-size="8.5">Description</text>
    <rect x="590" y="164" width="246" height="80" rx="5" fill="#101215" stroke="#2d3138"/>
    <text x="600" y="184" fill="#eae9e4" font-size="9.5">Steady, low-voiced, asks before</text>
    <text x="600" y="199" fill="#eae9e4" font-size="9.5">changing anything.</text>
    <line x1="252" y1="264" x2="836" y2="264" stroke="#2d3138"/>

    <text x="252" y="292" fill="#98a0a9" font-size="10" font-weight="600">VOICE AND STYLE</text>
    <text x="252" y="314" fill="#98a0a9" font-size="8.5">Reply register</text>
    <rect x="252" y="320" width="280" height="30" rx="5" fill="#101215" stroke="#2d3138"/>
    <text x="262" y="339" fill="#eae9e4" font-size="10">Intimate</text>
    <text x="556" y="314" fill="#98a0a9" font-size="8.5">Reaction style</text>
    <rect x="556" y="320" width="280" height="30" rx="5" fill="#101215" stroke="#2d3138"/>
    <text x="566" y="339" fill="#eae9e4" font-size="10">Tender</text>
    <line x1="252" y1="370" x2="836" y2="370" stroke="#2d3138"/>

    <text x="252" y="398" fill="#98a0a9" font-size="10" font-weight="600">BEHAVIOR</text>
    <text x="252" y="420" fill="#98a0a9" font-size="8.5">Prompt set</text>
    <rect x="252" y="426" width="280" height="30" rx="5" fill="#101215" stroke="#2d3138"/>
    <text x="262" y="445" fill="#eae9e4" font-size="10">MagicHandy Motion</text>
    <text x="556" y="420" fill="#98a0a9" font-size="8.5">Starting zone</text>
    <rect x="556" y="426" width="280" height="30" rx="5" fill="#101215" stroke="#2d3138"/>
    <text x="566" y="445" fill="#eae9e4" font-size="10">Full range</text>
    <line x1="252" y1="476" x2="836" y2="476" stroke="#2d3138"/>

    <text x="252" y="504" fill="#98a0a9" font-size="10" font-weight="600">LORE</text>
    <text x="836" y="504" fill="#98a0a9" font-size="8.5" text-anchor="end">6 entries</text>
    <rect x="252" y="516" width="584" height="28" rx="5" fill="#101215" stroke="#2d3138"/>
    <rect x="447" y="517" width="194" height="26" rx="4" fill="#5b9dd9"/>
    <text x="349" y="535" fill="#98a0a9" font-size="9" text-anchor="middle">Off</text>
    <text x="544" y="535" fill="#0b131c" font-size="9" font-weight="700" text-anchor="middle">Relevant only</text>
    <text x="739" y="535" fill="#98a0a9" font-size="9" text-anchor="middle">Full</text>
    <text x="252" y="562" fill="#98a0a9" font-size="8.5">Only matching entries enter the prompt, within the configured budget.</text>

    <!-- Fixed action row -->
    <line x1="232" y1="586" x2="862" y2="586" stroke="#2d3138"/>
    <rect x="252" y="603" width="72" height="30" rx="6" fill="#5b9dd9"/>
    <text x="288" y="622" fill="#0b131c" font-size="10" font-weight="700" text-anchor="middle">Save</text>
    <rect x="334" y="603" width="86" height="30" rx="6" fill="none" stroke="#3d434c"/>
    <text x="377" y="622" fill="#eae9e4" font-size="10" text-anchor="middle">Duplicate</text>
    <rect x="716" y="603" width="120" height="30" rx="6" fill="none" stroke="#c93b40"/>
    <text x="776" y="622" fill="#e5484d" font-size="10" text-anchor="middle">Delete persona</text>

    <!-- Global Stop stays visible and clickable above the modal layer -->
    <rect x="14" y="636" width="134" height="34" rx="8" fill="#b73339"/>
    <text x="81" y="657" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Stop</text>
  </g>
  <rect x="6" y="6" width="988" height="688" rx="16" fill="none" stroke="#2d3138"/>
</svg>
