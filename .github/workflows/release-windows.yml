name: Publish Windows release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require supported SemVer on main
        id: release
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $match = [regex]::Match(
            $tag,
            '^v(?<version>(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-(?:alpha|beta|rc)\.[1-9]\d*)?)$'
          )
          if (-not $match.Success) {
            throw "Unsupported release tag '$tag'. See docs/versioning-and-releases.md."
          }

          git fetch --no-tags origin main
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch origin/main.' }
          $commit = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $mainCommit = (git rev-parse origin/main).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve origin/main.' }
          if ($commit -ne $mainCommit) {
            throw "Release commit $commit is not the current origin/main commit $mainCommit."
          }
          if (git status --porcelain=v1 --untracked-files=all) {
            throw 'Release checkout is not clean.'
          }

          $notes = "docs/releases/$tag.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Release notes are missing: $notes"
          }

          "commit=$commit" >> $env:GITHUB_OUTPUT
          "prerelease=$($match.Value.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "version=$($match.Groups['version'].Value)" >> $env:GITHUB_OUTPUT

  quality:
    name: Release quality gates
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l $(find cmd internal web -name '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Go tests
        run: go test ./...

      - name: Race tests
        run: go test -race ./...

      - name: CGO-free build
        run: CGO_ENABLED=0 go build ./cmd/magichandy

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck frontend
        working-directory: web
        run: npm run typecheck

      - name: Test frontend
        working-directory: web
        run: npm run test

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Require canonical embedded bundle
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- web/dist)" ]; then
            git status --short --untracked-files=all -- web/dist
            exit 1
          fi

  publish:
    name: Build, verify, and publish Windows release
    needs: [validate, quality]
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install verified Inno Setup 7
        shell: powershell
        run: |
          $iscc = .\scripts\release\Install-InnoSetup.ps1 `
            -InstallRoot (Join-Path $env:RUNNER_TEMP 'inno-setup-7.0.2')
          "INNO_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test installer and recovery scripts
        shell: powershell
        run: .\scripts\test-installer.ps1

      - name: Build reviewed public Windows artifacts
        shell: powershell
        run: >-
          .\scripts\release\Build-WindowsRelease.ps1
          -Version "${{ needs.validate.outputs.version }}"
          -Commit "${{ needs.validate.outputs.commit }}"
          -OutputRoot "artifacts\release"
          -ISCCPath "$env:INNO_ISCC"

      - name: Verify reviewed public Windows artifacts
        shell: powershell
        run: >-
          .\scripts\release\Test-WindowsRelease.ps1
          -Version "${{ needs.validate.outputs.version }}"
          -Commit "${{ needs.validate.outputs.commit }}"
          -ArtifactsRoot "artifacts\release"
          -ArtifactPolicy ReviewedUnsignedPublic
          -ReviewedFalsePositiveCaseID "15c1e36d-fb35-4c5d-85de-83707169818a"
          -ExerciseInstaller
          -ExerciseDefaultInstall

      - name: Retain verified public release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: magichandy-windows-${{ needs.validate.outputs.version }}
          path: |
            artifacts/release/*-portable.zip
            artifacts/release/*-setup.exe
            artifacts/release/*-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $version = '${{ needs.validate.outputs.version }}'
          $assets = @(
            "artifacts/release/MagicHandy-$version-windows-amd64-portable.zip",
            "artifacts/release/MagicHandy-$version-windows-amd64-setup.exe",
            "artifacts/release/MagicHandy-$version-windows-amd64-SHA256SUMS.txt"
          )
          $arguments = @(
            'release', 'create', $tag,
            '--verify-tag',
            '--title', "MagicHandy $tag",
            '--notes-file', "docs/releases/$tag.md"
          )
          if ('${{ needs.validate.outputs.prerelease }}' -eq 'true') {
            $arguments += '--prerelease'
          }
          $arguments += $assets
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed (exit $LASTEXITCODE)." }
