name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l $(find cmd internal web -name '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: CGO-free build
        run: CGO_ENABLED=0 go build ./cmd/magichandy

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Component tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify committed bundle is current
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- dist)" ]; then
            echo "web/dist differs from a clean production build:"
            git status --short --untracked-files=all -- dist
            exit 1
          fi

  installer:
    name: Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PowerShell 5.1 installer tests
        shell: powershell
        run: .\scripts\test-installer.ps1

  labs:
    name: Optional Labs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build release UI with optional Labs
        working-directory: web
        run: npm ci && npm run build:labs
      - name: Test runtime Labs gates and shared motion path
        run: go test -race ./internal/motion ./internal/chat ./internal/httpapi ./web
      - name: CGO-free release build
        run: CGO_ENABLED=0 go build ./cmd/magichandy
