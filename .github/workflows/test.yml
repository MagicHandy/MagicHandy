name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l $(find cmd internal web -name '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Test
        run: go test ./...

      # Headroom for slow runners: internal/httpapi once came close to the
      # default 10-minute timeout under the race detector; see
      # docs/goal-scorecard.md (2026-09-30, httpapi race test time).
      - name: Publish source size advisories
        shell: bash
        run: |
          set -o pipefail
          go test -v ./internal/architecture -run '^TestSourceFileLineBudgets$' | tee "$RUNNER_TEMP/source-sizes.txt"
          {
            echo '### Source size advisories'
            awk '/advisory:/ { sub(/^.*advisory: /, "- "); print; found=1 } END { if (!found) print "All checked files are within their advisory guidelines." }' "$RUNNER_TEMP/source-sizes.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Race test
        run: go test -race -timeout 20m ./...

      - name: CGO-free build
        run: CGO_ENABLED=0 go build ./cmd/magichandy

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: React Hooks lint
        run: npm run lint

      - name: Component tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify committed bundle is current
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- dist)" ]; then
            echo "web/dist differs from a clean production build:"
            git status --short --untracked-files=all -- dist
            exit 1
          fi

  installer:
    name: Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PowerShell 5.1 installer tests
        shell: powershell
        run: .\scripts\test-installer.ps1

      - name: PowerShell 7 installer tests
        shell: pwsh
        run: .\scripts\test-installer.ps1

  voice-adapters:
    name: Voice adapters (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r scripts/tts/test-requirements.txt
      - run: python -m unittest discover -s scripts/tts/tests -v

  labs:
    name: Optional Labs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Compile tagged review commands
        run: go build -tags magichandy_labs ./cmd/motion-atlas ./cmd/cloud-motion-review ./cmd/motion-second-opinion-review
      - name: Tagged Go lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --build-tags magichandy_labs
      - name: Capture inert speed review
        run: |
          mkdir -p .scratch
          MAGICHANDY_SPEED_RUNTIME_REPORT="$PWD/.scratch/speed-review.json" go test -tags magichandy_labs ./internal/motion -run '^TestSpeedReviewRuntime$' -v -count=1
          test -s .scratch/speed-review.json
      - name: Test runtime Labs gates and shared motion path
        run: go test -race -timeout 20m ./internal/motion ./internal/chat ./internal/httpapi ./web
      - name: CGO-free release build
        run: CGO_ENABLED=0 go build ./cmd/magichandy

  depguard-fixture:
    name: Depguard rejection (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true
      - run: python scripts/check-depguard.py

  transport-parity:
    name: Inert transport comparison
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          mkdir -p .scratch
          MAGICHANDY_TRANSPORT_PARITY_REPORT="$PWD/.scratch/parity.json" go test -tags magichandy_labs ./internal/motion -run '^TestTransportParityReview$' -v -count=1
          test -s .scratch/parity.json
      - uses: actions/upload-artifact@v4
        with:
          name: transport-parity
          path: .scratch/parity.json
