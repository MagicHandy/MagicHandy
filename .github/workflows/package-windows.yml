name: Package Windows (no release)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/package-windows.yml"
      - ".github/workflows/release-windows.yml"
      - "installer/**"
      - "scripts/release/**"
      - "scripts/test-installer.ps1"
      - "install.ps1"
      - "update.ps1"
      - "scripts/install-llama-runtime.ps1"
      - "scripts/install-parakeet-module.ps1"
      - "scripts/install-tts-module.ps1"
      - "scripts/update-tts-module.ps1"
      - "scripts/installer/**"
      - "scripts/tts/**"
      - "cmd/**"
      - "internal/**"
      - "web/**"
      - "docs/**"
      - "README.md"
      - "LICENSE"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install verified Inno Setup 7
        shell: powershell
        run: |
          $iscc = .\scripts\release\Install-InnoSetup.ps1 `
            -InstallRoot (Join-Path $env:RUNNER_TEMP 'inno-setup-7.0.2')
          "INNO_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build unsigned CI lifecycle artifacts
        shell: powershell
        run: >-
          .\scripts\release\Build-WindowsRelease.ps1
          -Version "0.0.0-pr${{ github.event.pull_request.number || github.run_number }}"
          -Commit "${{ github.sha }}"
          -ISCCPath "$env:INNO_ISCC"

      - name: Verify unsigned CI lifecycle artifacts
        shell: powershell
        run: >-
          .\scripts\release\Test-WindowsRelease.ps1
          -Version "0.0.0-pr${{ github.event.pull_request.number || github.run_number }}"
          -Commit "${{ github.sha }}"
          -ArtifactPolicy UnsignedCI
          -ExerciseInstaller
          -ExerciseDefaultInstall

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: magichandy-windows-unsigned-ci-${{ github.run_number }}
          path: |
            artifacts/*-portable.zip
            artifacts/*-setup.exe
            artifacts/*-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
